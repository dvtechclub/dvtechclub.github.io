<!DOCTYPE html>
<html>
    <head>
        <title>Grade calculator</title>
        <meta name="author" content="Jason Tri Nguyen">
        <link rel="icon" type="image/x-icon" href="favicon.png">
        <link rel="stylesheet" href="main.css">
    </head>

    <body>
        
        <img src="dvhslogo.png" width="217" height="276">
        
        <div id="weightContainer">
            <div>
                <h1>Assessment(%):</h1>
                <input id="aWeight" type="number" value="80" min ="">
            </div>
            <div>
                <h1>Coursework(%):</h1>
                <input id="cWeight" type="number" value="20" min ="0">
            </div>
            
        </div>
        
        <div id="examples">
            <h3>Copy and paste exactly like the photo DO NOT highlight anything else</h3>
            <div>
                <img src="example.png" alt="example" width="420" height="171">
                <video width="320" height="240" controls> <source src="https://codehs.com/uploads/9a37d416fc9eeda9ac2bd40f822e6701" type="video/webm">    
            </div>
            
        </div>
        
        
  
</video>
        <div>
            <textarea id="school" rows="10" cols="50"placeholder="copy and paste from powerschools"></textarea>
            <button id="copypaste">Submit</button>
        </div>
        
        <table>
            <tbody id="gradeTable">
                <template id="row">
                    <tr class="calc">
                        <td>
                            <input class="name" type="text" placeholder="blahblah">
                        </td>
                        <td>
                            <input class="value"type="text"placeholder="15/20 type it exactly like this" >
                        </td>
                        <td>
                            <select class="weight">
                                <option>Assessment</option>
                                <option>Coursework</option>
                            </select>
                        </td>
                    </tr>
                
                </template>
                <tr>
                    <td>
                        Name(Optional)
                    </td>
                    <td>
                        Grade
                    </td>
                    <td>
                        Type
                    </td>
                </tr>
                <tr class="calc">
                    <td>
                        <input class="name" type="text" placeholder="blahblah">
                    </td>
                    <td>
                        <input class="value"type="text"placeholder="15/20 type it exactly like this" >
                    </td>
                    <td>
                        <select class="weight">

                            <option>Assessment</option>
                            <option>Coursework</option>
                        </select>
                    </td>
                </tr>
                <tr class="calc">
                    <td>
                        <input class="name" type="text" placeholder="blahblah">
                    </td>
                    <td>
                        <input class="value"type="text"placeholder="15/20 type it exactly like this" >
                    </td>
                    <td>
                        <select class="weight">
                            <option>Assessment</option>
                            <option>Coursework</option>
                        </select>
                    </td>
                </tr>
            </tbody>
        
        </table>
        
        <div class="buttons"> 
            
            <div class="calculate">
                 <button id="calcbtn">Calculate</button>
            </div>
            <div class="modify">
                <button id="addRow">Add row</button>
            
                <button id="reset">Reset</button>
                
            </div>
        
        </div>
        
        <h1>Final Grade: </h1>
        
        <p id="grade"style="border-style: solid;">0</p>
        
        <h1>Made by: Jason Tri Nguyen</h1>
        
        <input type="checkbox" name="round" id="round" checked>
        <label for="round">Round?</label>
        
        <img src="arrowdown.gif" height="50px">
        <a href="../../projects.html">Go back to the project page</a>
        
        
        <script src="main.js"></script>
    </body>
</html>
